name: Lint

on:
  push:
    branches: [main]
  pull_request:
  # Started by the Changelog workflow for the commit it adds to a Renovate
  # pull request: a push with GITHUB_TOKEN starts no pull_request run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./yuvomi

  versions-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: config.yaml and Dockerfile use the same Yuvomi version
        run: |
          app=$(sed -nE 's/^version: "([^"]+)"/\1/p' yuvomi/config.yaml)
          tag=$(sed -nE 's/^ARG BUILD_FROM=ghcr\.io\/ulsklyc\/yuvomi:([0-9.]+)$/\1/p' yuvomi/Dockerfile)
          [ -n "$tag" ] && [ "$tag" = "$app" ] || { echo "Dockerfile uses '$tag', config.yaml says $app"; exit 1; }
          echo "Both at $app"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for amd64 and aarch64
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 yuvomi

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Yuvomi version from the Dockerfile
        id: yuvomi
        run: |
          tag=$(sed -nE 's/^ARG BUILD_FROM=ghcr\.io\/ulsklyc\/yuvomi:([0-9.]+)$/\1/p' yuvomi/Dockerfile)
          [ -n "$tag" ] || { echo "No Yuvomi tag in yuvomi/Dockerfile"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ulsklyc/yuvomi
          ref: v${{ steps.yuvomi.outputs.tag }}
          path: upstream
          persist-credentials: false
      # Yuvomi's engines field asks for ^22.14.0 || >=23.6.0.
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install Yuvomi
        working-directory: upstream
        run: npm ci --omit=dev
      - name: Launcher against the real Yuvomi server
        run: sh scripts/test-launcher.sh "$GITHUB_WORKSPACE/upstream"
