name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  addon-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./yuvomi

  versions-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: config.yaml and build.yaml use the same Yuvomi version
        run: |
          app=$(sed -nE 's/^version: "([^"]+)"/\1/p' yuvomi/config.yaml)
          for tag in $(sed -nE 's/.*ghcr\.io\/ulsklyc\/yuvomi:([0-9.]+).*/\1/p' yuvomi/build.yaml); do
            [ "$tag" = "$app" ] || { echo "build.yaml uses $tag, config.yaml says $app"; exit 1; }
          done
          echo "Both at $app"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for amd64 and aarch64
        run: |
          from=$(sed -nE 's/^  amd64: (.*)/\1/p' yuvomi/build.yaml)
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg BUILD_FROM="$from" yuvomi
