name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  addon-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./yuvomi

  versions-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: config.yaml and Dockerfile use the same Yuvomi version
        run: |
          app=$(sed -nE 's/^version: "([^"]+)"/\1/p' yuvomi/config.yaml)
          tag=$(sed -nE 's/^ARG BUILD_FROM=ghcr\.io\/ulsklyc\/yuvomi:([0-9.]+)$/\1/p' yuvomi/Dockerfile)
          [ -n "$tag" ] && [ "$tag" = "$app" ] || { echo "Dockerfile uses '$tag', config.yaml says $app"; exit 1; }
          echo "Both at $app"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build for amd64 and aarch64
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 yuvomi
